<!-- ❌ Limitations of plain forms/buttons app.get/post methods
Only support GET and POST — you can’t do PUT, PATCH, DELETE easily.
Always reload the page (unless you prevent it with JS).
Harder to work with dynamically — e.g., sending data from a JS variable or responding to an event.
Can’t easily handle JSON — forms submit URL-encoded data, not JSON.
Can't dynamically fetch or update data without reloading.

✅ What fetch() enables
Works with all HTTP methods (GET, POST, PUT, DELETE, etc.)
No page reload (AJAX-style)
Send and receive JSON easily
Allows dynamic interactions:
Load more posts on scroll
Submit a form and show a success message inline
Validate input on the fly
Build SPA (Single Page Applications) -->
